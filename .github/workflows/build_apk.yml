name: 📱 Build Android APKs (CF Bot 4G, WiFi & Commercial)

on:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 🔨 Build Debug APKs (4G, WiFi & Commercial)
        working-directory: ./android-app
        run: gradle assembleDebug --no-daemon

      - name: 📦 Copy APKs to webapp static folder and commit
        run: |
          mkdir -p webapp/static
          cp android-app/app/build/outputs/apk/debug/app-debug.apk webapp/static/CFBot4G.apk
          cp android-app/app-wifi/build/outputs/apk/debug/app-wifi-debug.apk webapp/static/CFBotWiFi.apk
          cp android-app/app-commercial/build/outputs/apk/debug/app-commercial-debug.apk webapp/static/CFBot4G_Edicion_Comercial.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webapp/static/
          git diff --staged --quiet || git commit -m "build: Add compiled APKs CFBot4G, CFBotWiFi and CFBot4G_Edicion_Comercial"
          git push origin main

      - name: 📤 Upload 4G APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFBot4G-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: 📤 Upload Commercial APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFBot4G-Commercial-APK
          path: android-app/app-commercial/build/outputs/apk/debug/app-commercial-debug.apk

      - name: 📤 Upload WiFi APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFBotWiFi-Android-APK
          path: android-app/app-wifi/build/outputs/apk/debug/app-wifi-debug.apk

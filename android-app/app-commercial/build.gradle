apply plugin: 'com.android.application'

android {
    namespace 'com.criteriofinanciero.botcommercial'
    compileSdk 34

    defaultConfig {
        applicationId "com.criteriofinanciero.botcommercial"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0-Commercial"
    }

    buildTypes {
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.tananaev:adblib:1.3'
}
